<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="926" viewBox="0 0 1100 926" role="img" aria-labelledby="title desc">
<title id="title">git-create  ·  option 14  ·  branch management</title>
<desc id="desc">Terminal screenshot of the git-create menu-driven Git assistant.</desc>
<rect width="100%" height="100%" fill="#010409"/>
<rect x="1" y="1" width="1098" height="924" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<rect x="1" y="1" width="1098" height="54" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<rect x="1" y="40" width="1098" height="15" fill="#161b22" stroke="#161b22"/>
<circle cx="30" cy="28" r="6" fill="#ff5f56"/>
<circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
<circle cx="70" cy="28" r="6" fill="#27c93f"/>
<text x="94" y="33" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">git-create  ·  option 14  ·  branch management</text>
<text xml:space="preserve" x="28" y="84" fill="#58a6ff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">Branch management</text>
<text xml:space="preserve" x="28" y="106" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  Current: main</text>
<text xml:space="preserve" x="28" y="128" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  Local:   main, release/1.4, feature/ghcr</text>
<text xml:space="preserve" x="28" y="150" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  Remote:  origin/main, origin/release/1.4, origin/feature/ghcr</text>
<text xml:space="preserve" x="28" y="172" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  Upstream: origin/main</text>
<text xml:space="preserve" x="28" y="194" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5"></text>
<text xml:space="preserve" x="28" y="216" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  1) Show detailed branch list</text>
<text xml:space="preserve" x="28" y="238" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  2) Create a branch</text>
<text xml:space="preserve" x="28" y="260" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  3) Switch branch</text>
<text xml:space="preserve" x="28" y="282" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  4) Rename current branch</text>
<text xml:space="preserve" x="28" y="304" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  5) Delete local branch</text>
<text xml:space="preserve" x="28" y="326" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  6) Delete remote origin branch</text>
<text xml:space="preserve" x="28" y="348" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  7) Set upstream for current branch</text>
<text xml:space="preserve" x="28" y="370" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  8) Show branch graph</text>
<text xml:space="preserve" x="28" y="392" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  9) Rename an origin branch</text>
<text xml:space="preserve" x="28" y="414" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  0) Back</text>
<text xml:space="preserve" x="28" y="436" fill="#58a6ff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">Choose an option [0]: 4</text>
<text xml:space="preserve" x="28" y="458" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5"></text>
<text xml:space="preserve" x="28" y="480" fill="#e6edf3" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">What this does:</text>
<text xml:space="preserve" x="28" y="502" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  Runs git branch -m to rename the current local branch.</text>
<text xml:space="preserve" x="28" y="524" fill="#e6edf3" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">Why:</text>
<text xml:space="preserve" x="28" y="546" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  The commits stay exactly the same; only the branch name changes. This does not</text>
<text xml:space="preserve" x="28" y="568" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  rename the branch on the remote. Use option 9 for that.</text>
<text xml:space="preserve" x="28" y="590" fill="#e6edf3" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">Safety:</text>
<text xml:space="preserve" x="28" y="612" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  Git does not rewrite history. If the old remote branch exists, update it or set</text>
<text xml:space="preserve" x="28" y="634" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  a new upstream deliberately.</text>
<text xml:space="preserve" x="28" y="656" fill="#d2a8ff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">Command: git branch -m release/1.4</text>
<text xml:space="preserve" x="28" y="678" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5"><tspan fill="#3fb950" font-weight="700">[OK]</tspan> Branch renamed to 'release/1.4'.</text>
<text xml:space="preserve" x="28" y="700" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5"><tspan fill="#58a6ff" font-weight="700">[i]</tspan> The remote branch was not renamed. Push the new name and update the upstream if needed.</text>
<text xml:space="preserve" x="28" y="722" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5"></text>
<text xml:space="preserve" x="28" y="744" fill="#58a6ff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">Branch management</text>
<text xml:space="preserve" x="28" y="766" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  Current: release/1.4</text>
<text xml:space="preserve" x="28" y="788" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  Local:   main, release/1.4, feature/ghcr</text>
<text xml:space="preserve" x="28" y="810" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  Remote:  origin/main, origin/release/1.4, origin/feature/ghcr</text>
<text xml:space="preserve" x="28" y="832" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  Upstream: origin/release/1.4</text>
<text xml:space="preserve" x="28" y="854" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">  0) Back</text>
<text xml:space="preserve" x="28" y="876" fill="#58a6ff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">Choose an option [0]: </text>
</svg>

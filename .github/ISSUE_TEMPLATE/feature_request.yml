name: Feature request
description: Propose a safe, scoped improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or enterprise problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the menu or CLI flow, confirmations, and failure handling.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Git operations
        - GitHub integration
        - Security and secrets
        - Worktrees and submodules
        - Conflict resolution
        - CI and automation
        - Documentation
        - Enterprise policy or audit
        - Other
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Explain confirmations, recovery, secret handling, and no-force behavior.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: The proposal fits the single-file, standard-library runtime.
          required: true

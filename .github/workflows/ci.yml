name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check syntax
        run: python3 -c "compile(open('git-create').read(), 'git-create', 'exec')"

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Configure a test identity
        run: |
          git config --global user.name "git-create CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Run offline self-check
        run: |
          chmod +x git-create
          ./git-create --no-color check --offline

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install development tools
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        run: ruff check git-create tests
